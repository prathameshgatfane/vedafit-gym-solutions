<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gym Management — Admin</title>
    <script>
      (function () {
        var theme = "dark";
        try {
          if (window.localStorage.getItem("vedafit.admin.theme") === "light") theme = "light";
        } catch (e) {
          /* private mode / blocked storage: stay dark */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
